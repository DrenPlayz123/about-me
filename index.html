<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Anonymous Chatroom</title>
    <meta name="description" content="A global anonymous chatroom for everyone on the site." />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      body { margin: 0; background: #0d0f14; color: #f3f5ff; min-height: 100vh; display: grid; place-items: center; }
      .chat { width: min(900px, 92vw); height: min(700px, 88vh); border: 1px solid #2f3443; border-radius: 14px; background: #141822; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
      .header { padding: 1rem 1.25rem; border-bottom: 1px solid #2a2f3d; }
      .header h1 { margin: 0 0 0.35rem; font-size: 1.05rem; }
      .header p { margin: 0; color: #b6c0df; font-size: 0.9rem; }
      .me { color: #8fd0ff; font-weight: 600; }
      .messages { padding: 1rem 1.25rem; overflow: auto; display: flex; flex-direction: column; gap: 0.65rem; }
      .row { line-height: 1.4; }
      .row .name { color: #73e0ac; font-weight: 700; margin-right: 0.5rem; }
      .row.system { color: #afb8d5; font-style: italic; }
      form { border-top: 1px solid #2a2f3d; display: flex; gap: 0.6rem; padding: 1rem; }
      input { flex: 1; border: 1px solid #3a4154; background: #0f1320; color: #f3f5ff; border-radius: 10px; padding: 0.75rem 0.85rem; }
      button { border: 0; border-radius: 10px; padding: 0.75rem 1rem; background: #2f76f7; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .status { font-size: 0.85rem; color: #f9c97d; }
    </style>
  </head>
  <body>
    <section class="chat">
      <header class="header">
        <h1>🌐 Global Anonymous Chatroom</h1>
        <div>You are <span class="me" id="me">connecting...</span></div>
        <p class="status" id="status">Connecting...</p>
      </header>

      <main class="messages" id="messages"></main>

      <form id="chat-form">
        <input id="message-input" autocomplete="off" placeholder="Say something to everyone..." maxlength="500" />
        <button id="send-button" type="submit" disabled>Send</button>
      </form>
    </section>

    <script>
      const me = document.getElementById('me');
      const statusText = document.getElementById('status');
      const messages = document.getElementById('messages');
      const chatForm = document.getElementById('chat-form');
      const messageInput = document.getElementById('message-input');
      const sendButton = document.getElementById('send-button');

      let clientId = '';

      function addSystem(text) {
        const row = document.createElement('div');
        row.className = 'row system';
        row.textContent = text;
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
      }

      function addChat(sender, text) {
        const row = document.createElement('div');
        row.className = 'row';

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = sender;

        const content = document.createElement('span');
        content.textContent = text;

        row.append(name, content);
        messages.append(row);
        messages.scrollTop = messages.scrollHeight;
      }

      function setReady(ready) {
        sendButton.disabled = !ready;
        statusText.textContent = ready ? 'Live: connected to everyone on this site.' : 'Connecting...';
      }

      const stream = new EventSource('/events');

      stream.addEventListener('open', () => {
        addSystem('Connected to global chatroom.');
      });

      stream.addEventListener('error', () => {
        setReady(false);
        addSystem('Connection issue. Trying to reconnect...');
      });

      stream.addEventListener('identity', (event) => {
        const data = JSON.parse(event.data);
        clientId = data.clientId;
        me.textContent = data.username;
        setReady(true);
      });

      stream.addEventListener('system', (event) => {
        const data = JSON.parse(event.data);
        addSystem(data.message);
      });

      stream.addEventListener('chat', (event) => {
        const data = JSON.parse(event.data);
        addChat(data.username, data.message);
      });

      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = messageInput.value.trim();

        if (!text || !clientId || sendButton.disabled) {
          return;
        }

        const response = await fetch('/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, message: text })
        });

        if (!response.ok) {
          addSystem('Could not send message. Please wait and retry.');
          return;
        }

        messageInput.value = '';
      });
    </script>
  </body>
</html>
